spring:
  application:
    name: ai-chatbot-saas

  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/${POSTGRES_DB:mydatabase}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile

server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:}
  expiry: 86400000

# Groq for LLM (fast, free tier available)
groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
  api-key: ${GROQ_API_KEY:}

# Ollama fallback (local)
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}
  embedding-model: nomic-embed-text

# ChromaDB for RAG
chroma:
  base-url: ${CHROMA_BASE_URL:http://localhost:8000}
  tenant: ${CHROMA_TENANT:default_tenant}
  database: ${CHROMA_DATABASE:default_database}
  collection: ${CHROMA_COLLECTION:documents}

file:
  upload-dir: uploads

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

logging:
  level:
    com.zaxxer.hikari: WARN
    org.postgresql: WARN
    com.riya.aichatbot: DEBUG