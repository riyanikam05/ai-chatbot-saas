
spring:
  application:
    name: ai-chatbot-saas

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/mydatabase}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: email, profile

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:}
  expiry: 86400000

groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
  api-key: ${GROQ_API_KEY:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  embedding-model: gemini-embedding-001
  embedding-dimensions: 768

file:
  upload-dir: uploads

management:
  endpoints:
    web:
      exposure:
        include: health, info, mappings

logging:
  level:
    com.zaxxer.hikari: WARN
    org.postgresql: WARN
    com.riya.aichatbot: INFO